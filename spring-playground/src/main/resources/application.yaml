service:
  name: spring-playground

spring:
  application:
    name: spring-playground
  data:
    redis:
      host: redis
      port: 6379

management:
  tracing:
    sampling:
      probability: 1.0  # 100% for development
  # Metrics no longer go over OTLP from the app: Alloy scrapes them from
  # /actuator/prometheus into Prometheus instead. Expose the endpoint.
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  oltp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    logging:
      export:
        oltp:
          enabled: false
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

logging:
  level:
    root: info
    io.opentelemetry: warn
