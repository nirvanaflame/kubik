# ---------------------------------------------------------------------------
# ci/registry.yaml — in-cluster container registry that the self-hosted
# GitHub Actions runner (DinD) pushes to and Argo CD / the app deployments
# pull from. Replaces the previous "local Docker Desktop image store" hack
# with a standard, self-contained registry. Dev-only (HTTP, no auth).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: ci
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ci
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ci
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      name: http
