apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ------------------------------------------------------------------
# Dev overlay: renders base + local-dev tweaks into the
# spring-playground namespace. Apply with:
#     kubectl apply -k overlays/dev
# ------------------------------------------------------------------

resources:
  - ../../base

namespace: spring-playground

patches:
  # Dev: run 2 replicas of the main app (base stays at 1).
  - target:
      kind: Deployment
      name: spring-playground
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
