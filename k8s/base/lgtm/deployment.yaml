apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
      annotations:
        sidecar.istio.io/inject: "false"   # observability infra: keep out of the mesh
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:latest
          env:
            # Retention: old data is deleted automatically so the stack stays under ~2GB.
            # Prometheus: size-based cap (hard) + time cap -> metrics pruned at 1GB
            - name: PROMETHEUS_EXTRA_ARGS
              value: "--storage.tsdb.retention.size=1GB --storage.tsdb.retention.time=48h"
            # Loki: time-based retention (Loki has no size cap; 48h is plenty for dev)
            - name: LOKI_EXTRA_ARGS
              value: "-compactor.retention-enabled=true -store.retention=48h -compactor.delete-request-store=filesystem"
            # Tempo: drop trace blocks older than 12h
            - name: TEMPO_EXTRA_ARGS
              value: "-compactor.compaction.compaction.block-retention=12h"
            # Pyroscope: drop profile blocks older than 24h
            - name: PYROSCOPE_EXTRA_ARGS
              value: "-compactor.blocks-retention-period=24h"
          ports:
            - containerPort: 3000   # Grafana UI
            - containerPort: 3100   # Loki
            - containerPort: 4317   # OpenTelemetry GRPC
            - containerPort: 4318   # OpenTelemetry HTTP
            - containerPort: 3200   # Tempo (MCP)
            - containerPort: 4040   # Pyroscope
            - containerPort: 9090   # Prometheus
          startupProbe:             # all-in-one image takes a while to come up
            httpGet:
              path: /
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          # Hard cap on the whole stack (logs/traces/metrics/profiles):
          # if retention ever fails to keep it under 2Gi, the pod is evicted
          # and restarts with an empty store.
          emptyDir:
            sizeLimit: 2Gi
