apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        sidecar.istio.io/inject: "false"   # pure infra: keep out of the mesh
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        # Exposes Prometheus-format metrics (redis_*, etc.) on :9121 for Alloy.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.89.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - containerPort: 9121
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
