apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
      annotations:
        sidecar.istio.io/inject: "false"   # log collector: no mesh needed
    spec:
      serviceAccountName: alloy
      # run on every node, including the tainted control-plane (for its kube-system logs)
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.18.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: varlog
              mountPath: /var/log
              readOnly: true
          securityContext:
            runAsUser: 0                 # root: /var/log/pods is root-owned on the nodes
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: varlog
          hostPath:
            path: /var/log
