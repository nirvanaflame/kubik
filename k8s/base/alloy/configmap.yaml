apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    logging {
      level = "warn"
    }

    // Discover every pod in the cluster.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Promote the discovered meta labels into real query labels
    // (namespace, pod, container), otherwise they are dropped at push.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    // Tail every container's log file on this node (via /var/log/pods)
    // and forward to Loki inside the lgtm stack.
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.lgtm.receiver]
    }

    loki.write "lgtm" {
      endpoint {
        url = "http://lgtm:3100/loki/api/v1/push"
      }
    }

    // --- Metrics ---

    // Scrape the app's own Prometheus endpoint and remote-write it into the
    // LGTM stack's Prometheus (receiver enabled). Replaces push-from-app OTLP metrics.
    prometheus.scrape "spring_playground" {
      targets = [{
        "__address__"     = "spring-playground:80",
        "__metrics_path__" = "/actuator/prometheus",
        "__metrics_job__"  = "spring-playground",
      }]
      scrape_interval = "30s"
      forward_to = [prometheus.remote_write.lgtm.receiver]
    }

    // Scrape Redis metrics from the exporter sidecar (redis:9121) and
    // remote-write them into the LGTM stack's Prometheus (receiver enabled).
    prometheus.scrape "redis" {
      targets = [{
        "__address__"    = "redis:9121",
        "__metrics_job__" = "redis",
      }]
      scrape_interval = "30s"
      forward_to = [prometheus.remote_write.lgtm.receiver]
    }

    prometheus.remote_write "lgtm" {
      endpoint {
        url = "http://lgtm:9090/api/v1/write"
      }
    }