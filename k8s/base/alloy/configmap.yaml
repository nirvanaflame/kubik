apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    logging {
      level = "warn"
    }

    // Discover every pod in the cluster.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Tail every container's log file on this node (via /var/log/pods)
    // and forward to Loki inside the lgtm stack.
    loki.source.kubernetes "pods" {
      targets    = discovery.kubernetes.pods.targets
      forward_to = [loki.write.lgtm.receiver]
    }

    loki.write "lgtm" {
      endpoint {
        url = "http://lgtm:3100/loki/api/v1/push"
      }
    }
