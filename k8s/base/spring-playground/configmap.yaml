apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-playground-config
data:
  # Override the hardcoded localhost OTLP endpoints in application.yaml:
  # inside the pod "localhost" is the pod itself, so point at the in-cluster
  # lgtm Service instead.
  # Metrics no longer go over OTLP; Alloy scrapes /actuator/prometheus into Prometheus.
  # Logs no longer go over OTLP; Alloy tails pod JSON logs into Loki.
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://lgtm:4318/v1/traces"

  # The data-redis starter defaults to localhost:6379; route it to the
  # redis Service so /actuator/health stays GREEN (probes depend on it).
  SPRING_DATA_REDIS_HOST: "redis"
